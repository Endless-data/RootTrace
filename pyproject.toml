[project]
name = "roottrace"
version = "0.1.0"
description = "Genealogy management system for the RootTrace experiment."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "flask>=3.1,<4.0",
    "flask-sqlalchemy>=3.1,<4.0",
    "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
