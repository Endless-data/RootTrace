<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RootTrace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="{{ url_for('main.index') }}">
          <span class="brand__name">RootTrace</span>
          <span class="brand__tagline">族谱管理系统</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          {% if g.user %}
            <span class="user-label">{{ g.user.display_name }}</span>
            <a href="{{ url_for('family_trees.index') }}">族谱管理</a>
            <form action="{{ url_for('auth.logout') }}" method="post">
              <button type="submit">退出登录</button>
            </form>
          {% else %}
            <a href="{{ url_for('auth.register') }}">注册</a>
            <a href="{{ url_for('auth.login') }}">登录</a>
          {% endif %}
        </nav>
      </div>
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
