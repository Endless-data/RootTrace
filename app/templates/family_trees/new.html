{% extends "base.html" %}

{% block content %}
  <div class="page-header">
    <div>
      <h2>创建族谱</h2>
      <p>开始一份新的族谱记录。</p>
    </div>
  </div>
  {% if error %}
    <p role="alert">{{ error }}</p>
  {% endif %}
  <form method="post">
    <label for="name">谱名</label>
    <input id="name" name="name" required>

    <label for="surname">姓氏</label>
    <input id="surname" name="surname" required>

    <label for="revision_time">修谱日期</label>
    <input id="revision_time" name="revision_time" type="date">

    <button type="submit">创建</button>
  </form>
{% endblock %}
