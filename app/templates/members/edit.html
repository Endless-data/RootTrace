{% extends "base.html" %}

{% block content %}
  <div class="page-header">
    <div>
      <h2>编辑成员 - {{ member.name }}</h2>
      <p>更新成员资料和生平信息。</p>
    </div>
  </div>
  {% if error %}
    <p role="alert">{{ error }}</p>
  {% endif %}
  <form method="post">
    <label for="name">姓名</label>
    <input id="name" name="name" value="{{ member.name }}" required>

    <label for="gender">性别</label>
    <select id="gender" name="gender">
      {% set gender_labels = {"unknown": "未知", "male": "男", "female": "女"} %}
      {% for value in ["unknown", "male", "female"] %}
        <option value="{{ value }}" {% if member.gender == value %}selected{% endif %}>
          {{ gender_labels[value] }}
        </option>
      {% endfor %}
    </select>

    <label for="birth_year">出生年份</label>
    <input id="birth_year" name="birth_year" value="{{ member.birth_year or '' }}" inputmode="numeric">

    <label for="death_year">死亡年份</label>
    <input id="death_year" name="death_year" value="{{ member.death_year or '' }}" inputmode="numeric">

    <label for="generation">辈分</label>
    <input id="generation" name="generation" value="{{ member.generation or '' }}" inputmode="numeric">

    <label for="biography">生平简介</label>
    <textarea id="biography" name="biography">{{ member.biography }}</textarea>

    <button type="submit">保存</button>
  </form>
{% endblock %}
