services:
  web:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://roottrace@db:5432/roottrace
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roottrace
      POSTGRES_DB: roottrace
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - ./sql:/schema:ro
      - ./data/generated:/generated:ro
      - ./exports:/exports
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roottrace -d roottrace"]
      interval: 5s
      timeout: 5s
      retries: 10
